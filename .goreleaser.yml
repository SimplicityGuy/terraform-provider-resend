version: 2

# The registries require assets named terraform-provider-<name>_<version>_*.
# Set explicitly so a clone or worktree under another directory name cannot
# change it.
project_name: terraform-provider-resend

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  # The registry manifest declares protocol version 6; without it in the
  # release (and in SHA256SUMS) the registries assume protocol 5.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# A binary (not --armor) detached signature of SHA256SUMS, as the Terraform
# Registry requires. The release workflow presets the key's passphrase in
# gpg-agent, so this gpg call never sees the passphrase.
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  prerelease: auto
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # RESEND_GO_VERSION must be set by the release workflow (the resend-go
  # module version this build links against; release.yml reads it from go.mod).
  # The header is published above the notes passed with --release-notes.
  header: |
    Built with resend-go {{ .Env.RESEND_GO_VERSION }}.

# The release notes are this version's CHANGELOG.md section (highlights plus the
# Commitizen entries), which release.yml passes with --release-notes. The
# changelog pipe must stay enabled for that flag to be read: with
# `disable: true` GoReleaser skips the pipe and ignores the notes file. When the
# flag is given the pipe only loads the file and generates nothing of its own.
